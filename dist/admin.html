<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản trị — Dạ Ký</title><link rel="stylesheet" href="assets/css/style.css"></head><body><section class="login" id="loginView"><div class="login-card"><div class="eyebrow">Dạ Ký CMS</div><h1>Đăng nhập</h1><p class="small">Khu vực dành cho quản trị viên.</p><form id="loginForm"><input class="control" type="email" id="email" placeholder="Email" required><input class="control" type="password" id="password" placeholder="Mật khẩu" required><button class="btn primary" type="submit">Đăng nhập</button><div id="loginMessage" class="notice hidden"></div></form></div></section><section class="admin-shell hidden" id="adminView"><aside class="sidebar"><a class="brand" href="index.html">DẠ <i>KÝ</i></a><nav><button class="active" data-view="list">Danh sách truyện</button><button data-view="editor">Thêm truyện mới</button><button id="logout">Đăng xuất</button></nav></aside><main class="admin-main"><div id="listView"><header class="admin-head"><div><div class="eyebrow">Quản lý nội dung</div><h1>Kho truyện</h1></div><button class="btn primary" id="newStory">+ Viết truyện</button></header><section class="stats"><div class="stat"><b id="sTotal">0</b><span>Tổng số truyện</span></div><div class="stat"><b id="sPublished">0</b><span>Đã xuất bản</span></div><div class="stat"><b id="sDraft">0</b><span>Bản nháp</span></div><div class="stat"><b id="sRegions">0</b><span>Khu vực</span></div></section><div class="panel"><div class="toolbar"><input id="adminSearch" class="control" placeholder="Tìm trong kho truyện…"><select id="adminStatus" class="control"><option value="">Tất cả trạng thái</option><option value="published">Đã xuất bản</option><option value="draft">Bản nháp</option></select></div><div class="table-wrap"><table><thead><tr><th>Truyện</th><th>Quốc gia</th><th>Khu vực</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr></thead><tbody id="storyRows"></tbody></table></div></div></div><div id="editorView" class="hidden"><header class="admin-head"><div><div class="eyebrow">Biên tập</div><h1 id="editorTitle">Thêm truyện mới</h1></div><button class="btn" id="backList">← Danh sách</button></header><form class="panel" id="storyForm"><input type="hidden" id="storyId"><div class="form-grid"><div class="field"><label>Tiêu đề *</label><input class="control" id="title" required></div><div class="field"><label>Đường dẫn slug *</label><input class="control" id="slug" required></div><div class="field"><label>Quốc gia *</label><input class="control" id="country" required></div><div class="field"><label>Khu vực *</label><input class="control" id="storyRegion" required></div><div class="field"><label>Loại truyền thuyết</label><input class="control" id="type"></div><div class="field"><label>Trạng thái</label><select class="control" id="status"><option value="draft">Bản nháp</option><option value="published">Xuất bản</option></select></div><div class="field full"><label>Mô tả ngắn *</label><textarea class="control" id="excerpt" required></textarea></div><div class="field full"><label>Nội dung truyện *</label><textarea class="control editor-body" id="body" required placeholder="Mỗi đoạn cách nhau bằng một dòng trống"></textarea></div><div class="field full"><label>Nguồn gốc dân gian</label><textarea class="control" id="origin"></textarea></div><div class="field full"><label>Các dị bản</label><textarea class="control" id="variants"></textarea></div><div class="field"><label>URL ảnh bìa</label><input class="control" id="coverUrl" type="url"></div><div class="field"><label>Ngày xuất bản</label><input class="control" id="publishedAt" type="datetime-local"></div><div class="field"><label>Tiêu đề SEO</label><input class="control" id="seoTitle"></div><div class="field"><label>Mô tả SEO</label><input class="control" id="seoDescription"></div></div><div class="form-actions"><button type="button" class="btn danger hidden" id="deleteStory">Xóa truyện</button><button type="submit" class="btn primary">Lưu truyện</button></div></form></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/admin.js"></script></body></html>
